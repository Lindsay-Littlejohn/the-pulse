<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Feedback — The Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Figtree', Arial, sans-serif; background: #F4EDEF; color: #401E2A; padding: 32px 20px; }
  .wrap { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #DCC7BE; }
  .hdr { background: #80515F; padding: 28px 32px; text-align: center; }
  .hdr h1 { color: #fff; font-size: 32px; font-weight: 600; letter-spacing: 4px; }
  .hdr .sub { color: #DCC7BE; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
  .hdr .iss { color: #B38693; font-size: 11px; margin-top: 3px; font-style: italic; }
  .body { padding: 32px; }
  .gallery-title { font-size: 20px; font-weight: 400; color: #80515F; margin-bottom: 8px; }
  .gallery-desc { font-size: 13px; color: #5F3C46; line-height: 1.7; margin-bottom: 24px; }
  .view-toggle { display: flex; gap: 8px; margin-bottom: 20px; }
  .vbtn { font-size: 12px; color: #80515F; background: #F4EDEF; border: 1px solid #DCC7BE; border-radius: 6px; padding: 5px 14px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .vbtn.on { background: #80515F; color: #fff; border-color: #80515F; }
  .stack-view { position: relative; height: 260px; margin-bottom: 48px; }
  .stack-card { position: absolute; width: 160px; height: 210px; border-radius: 10px; border: 4px solid #fff; overflow: hidden; cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; box-shadow: 0 3px 10px rgba(64,30,42,0.18); }
  .stack-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stack-card .cap { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(64,30,42,0.72); color: #fff; font-size: 11px; padding: 6px 9px; }
  .stack-card .hint { position: absolute; top: 6px; right: 6px; background: rgba(64,30,42,0.6); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .grid-view { display: none; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .grid-card { border-radius: 10px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(64,30,42,0.12); cursor: pointer; transition: transform 0.2s ease; }
  .grid-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .grid-card .cap { background: #F4EDEF; font-size: 11px; color: #5F3C46; padding: 6px 10px; }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(64,30,42,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .lightbox.open { display: flex; }
  .lb-inner { position: relative; max-width: 90vw; max-height: 90vh; text-align: center; }
  .lb-close { position: absolute; top: -44px; right: 0; background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; font-family: inherit; line-height: 1; }
  .lb-img { max-width: 90vw; max-height: 78vh; border-radius: 10px; border: 4px solid #fff; display: block; }
  .lb-cap { color: #DCC7BE; font-size: 13px; margin-top: 12px; }
  .lb-hint { color: #B38693; font-size: 11px; margin-top: 6px; }
  .ftr { background: #F4EDEF; padding: 18px 32px; text-align: center; border-top: 1px solid #DCC7BE; }
  .ftr p { font-size: 11px; color: #B38693; line-height: 1.8; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #80515F; text-decoration: none; margin-bottom: 12px; }
</style>
</head>

</div>

</div>

  var rotations = [-7,4,-2,6,-1];
  var offsets = [{"x":0,"y":8},{"x":42,"y":0},{"x":84,"y":12},{"x":126,"y":3},{"x":168,"y":8}];

  function openLightbox(src, cap) {
    var lb = document.getElementById('lightbox');
    var img = document.getElementById('lb-img');
    var capEl = document.getElementById('lb-cap');
    img.src = src;
    capEl.textContent = cap || '';
    capEl.style.display = cap ? 'block' : 'none';
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('back-btn').addEventListener('click', function() { window.history.back(); });
  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeLightbox();
  });

  function buildStack() {
    var sv = document.getElementById('sv');
    sv.innerHTML = '';
    photos.forEach(function(p, i) {
      var card = document.createElement('div');
      card.className = 'stack-card';
      card.style.left = offsets[i].x + 'px';
      card.style.top = offsets[i].y + 'px';
      card.style.zIndex = i + 1;
      card.style.transform = 'rotate(' + rotations[i] + 'deg)';
      var origRot = rotations[i];
      var origZ = i + 1;
      card.addEventListener('mouseover', function() {
        this.style.transform = 'translateY(-16px) scale(1.1) rotate(0deg)';
        this.style.zIndex = 10;
        this.style.boxShadow = '0 16px 32px rgba(64,30,42,0.28)';
      });
      card.addEventListener('mouseout', function() {
        this.style.transform = 'rotate(' + origRot + 'deg)';
        this.style.zIndex = origZ;
        this.style.boxShadow = '0 3px 10px rgba(64,30,42,0.18)';
      });
      card.addEventListener('click', function() { openLightbox(p.src, p.cap); });
      var img = document.createElement('img');
      img.src = p.src;
      img.alt = p.cap || '';
      card.appendChild(img);
      if (p.cap) {
        var capDiv = document.createElement('div');
        capDiv.className = 'cap';
        capDiv.textContent = p.cap;
        card.appendChild(capDiv);
      }
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'click to enlarge';
      card.appendChild(hint);
      sv.appendChild(card);
    });
  }

  function buildGrid() {
    var gv = document.getElementById('gv');
    gv.innerHTML = '';
    photos.forEach(function(p) {
      var card = document.createElement('div');
      card.className = 'grid-card';
      card.addEventListener('mouseover', function() { this.style.transform = 'scale(1.04)'; });
      card.addEventListener('mouseout', function() { this.style.transform = 'scale(1)'; });
      card.addEventListener('click', function() { openLightbox(p.src, p.cap); });
      var img = document.createElement('img');
      img.src = p.src;
      img.alt = p.cap || '';
      card.appendChild(img);
      if (p.cap) {
        var capDiv = document.createElement('div');
        capDiv.className = 'cap';
        capDiv.textContent = p.cap;
        card.appendChild(capDiv);
      }
      gv.appendChild(card);
    });
  }

  function setView(v) {
    var sv = document.getElementById('sv');
    var gv = document.getElementById('gv');
    var btnStack = document.getElementById('vb-stack');
    var btnGrid = document.getElementById('vb-grid');
    sv.style.display = v === 'stack' ? 'block' : 'none';
    gv.style.display = v === 'grid' ? 'grid' : 'none';
    btnStack.className = 'vbtn' + (v === 'stack' ? ' on' : '');
    btnGrid.className = 'vbtn' + (v === 'grid' ? ' on' : '');
  }

  document.getElementById('vb-stack').addEventListener('click', function() { setView('stack'); });
  document.getElementById('vb-grid').addEventListener('click', function() { setView('grid'); });

  buildStack();
  buildGrid();
})();
</script>
